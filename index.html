<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#020308" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CalamityVille" />
  <meta
    name="description"
    content="CalamityVille — live disasters on a 3D Earth: earthquakes, tsunamis, tornadoes, hurricanes, floods, wildfires, and volcanoes."
  />
  <!-- social-share meta (tier-a) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mark Maga" />
  <meta property="og:title" content="CalamityVille" />
  <meta property="og:description" content="Live disasters on a 3D Earth: earthquakes, storms, fires, and more." />
  <meta property="og:url" content="https://calamityville.markmaga.com/" />
  <meta property="og:image" content="https://calamityville.markmaga.com/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CalamityVille" />
  <meta name="twitter:description" content="Live disasters on a 3D Earth: earthquakes, storms, fires, and more." />
  <meta name="twitter:image" content="https://calamityville.markmaga.com/icon-512.png" />
  <title>CalamityVille</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://earthquake.usgs.gov" crossorigin />
  <link rel="preconnect" href="https://www.nhc.noaa.gov" crossorigin />
  <link rel="preconnect" href="https://eonet.gsfc.nasa.gov" crossorigin />
  <link rel="preconnect" href="https://services.arcgis.com" crossorigin />
  <link rel="preconnect" href="https://www.gdacs.org" crossorigin />
  <link rel="preconnect" href="https://firms.modaps.eosdis.nasa.gov" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="modulepreload" href="https://unpkg.com/three@0.160.0/build/three.module.js" />
  <!-- Heavy textures load on demand in app.js (no multi-MB preloads). -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #020308;
      --text: #e8edf7;
      --muted: #8b95a8;
      --surface: rgba(12, 16, 28, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #4a9eff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      max-height: 100dvh;
      min-height: 100lvh;
      overflow: hidden;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }

    .fit-stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .fit-stage--fluid .app {
      width: 100%;
      height: 100%;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #globe-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Title is display-only; only the bottom card should capture taps */
    .chrome > .bottom-card { pointer-events: auto; }

    /* Shared Mark Maga title (Michroma) — matches SuperMoon / SolarDashboard / OrbitalView */
    .app-chrome {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      top: 0;
      height: calc(0.375in + env(safe-area-inset-top, 0px));
      padding:
        env(safe-area-inset-top, 0px)
        max(1rem, env(safe-area-inset-right, 0px))
        0
        max(1rem, env(safe-area-inset-left, 0px));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    .app-title {
      margin: 0;
      font-family: "Michroma", system-ui, sans-serif;
      font-weight: 400;
      /* Mac / fine pointer: original size */
      font-size: clamp(1.05rem, 3.2vmin, 1.35rem);
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    /* Phone + iPad: +1px on the clamp (not Mac) */
    @media (pointer: coarse) {
      .app-title {
        font-size: clamp(calc(1.05rem + 1px), calc(3.2vmin + 1px), calc(1.35rem + 1px));
      }
    }

    /* Bottom card: time + center toggles + legend + count */
    .bottom-card {
      position: absolute;
      bottom: max(0.5rem, env(safe-area-inset-bottom));
      left: max(0.5rem, env(safe-area-inset-left));
      right: max(0.5rem, env(safe-area-inset-right));
      max-width: 28rem;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      padding: 0.35rem 0.45rem 0.32rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem 0.4rem;
    }

    .time-toggle,
    .center-toggle {
      display: flex;
      gap: 0.12rem;
      padding: 0.12rem;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    /* Push Earth/Moon + Orbit to the right of the top row */
    .center-toggle {
      margin-left: auto;
    }

    .time-btn,
    .center-btn,
    .orbit-btn,
    .vision-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.68rem;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1.15;
    }

    .orbit-btn,
    .vision-btn {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .time-btn.active,
    .center-btn.active,
    .orbit-btn.active,
    .vision-btn[aria-pressed="true"] {
      background: rgba(74, 158, 255, 0.22);
      color: var(--text);
    }

    #event-count {
      margin-left: auto;
      font-size: 0.62rem;
      color: var(--muted);
      line-height: 1.2;
      padding: 0.1rem 0.15rem;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem 0.45rem;
      font-size: 0.62rem;
      color: var(--muted);
      padding-top: 0.22rem;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      border: none;
      background: transparent;
      font: inherit;
      font-size: inherit;
      color: inherit;
      cursor: pointer;
      padding: 0.1rem 0.15rem;
      border-radius: 0.3rem;
      transition: opacity 0.2s, background 0.15s;
      line-height: 1.2;
    }

    .legend-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .legend-item.off {
      opacity: 0.32;
    }

    .legend-item.active {
      opacity: 1;
    }

    .legend-dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot--tornado {
      background: radial-gradient(circle at center, #ff2d55 0 60%, #f8fafc 61%);
    }

    .legend-dot--tornado-confirmed {
      background: radial-gradient(circle at center, #f8fafc 0 60%, #ff2d55 61%);
    }

    .legend-tornado-key {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
    }

    @media (max-width: 380px) {
      .time-btn,
      .center-btn,
      .orbit-btn,
      .vision-btn {
        font-size: 0.62rem;
        padding: 0.2rem 0.42rem;
      }
    }

    /* iPad / tablet only — not Mac (fine pointer). Phone keeps base styles. */
    @media (min-width: 768px) and (pointer: coarse) {
      .bottom-card {
        max-width: 36rem;
        gap: 0.4rem;
        padding: 0.5rem 0.65rem 0.48rem;
        border-radius: 0.7rem;
      }

      .controls-row {
        gap: 0.4rem 0.55rem;
      }

      .time-toggle,
      .center-toggle {
        gap: 0.16rem;
        padding: 0.16rem;
      }

      .time-btn,
      .center-btn,
      .orbit-btn,
      .vision-btn {
        font-size: 0.82rem;
        padding: 0.32rem 0.72rem;
      }

      .legend {
        gap: 0.28rem 0.6rem;
        font-size: 0.76rem;
        padding-top: 0.32rem;
      }

      .legend-item {
        padding: 0.14rem 0.22rem;
        gap: 0.32rem;
      }

      .legend-dot {
        width: 0.55rem;
        height: 0.55rem;
      }

      #event-count {
        font-size: 0.74rem;
      }
    }

    /*
     * Night vision (SuperMoon / SuperMars): red UI + blood cast on the globe.
     * Label shows next action: Red → White when on.
     */
    body.is-red-mode {
      --text: #c81820;
      --muted: #9a1018;
      --surface: rgba(18, 2, 2, 0.88);
      --border: rgba(180, 30, 36, 0.28);
      --accent: #e02028;
      background: #030000;
      color: var(--text);
    }

    body.is-red-mode .fit-stage,
    body.is-red-mode .app {
      background: #030000;
    }

    body.is-red-mode #globe-canvas {
      filter: sepia(1) hue-rotate(-48deg) saturate(6.2) brightness(0.38) contrast(1.08);
    }

    body.is-red-mode .app-title {
      color: #c0141c;
      text-shadow: 0 1px 10px rgba(40, 0, 0, 0.7);
    }

    body.is-red-mode .time-toggle,
    body.is-red-mode .center-toggle,
    body.is-red-mode .orbit-btn,
    body.is-red-mode .vision-btn {
      background: rgba(40, 4, 4, 0.55);
      border-color: #3a0c0c;
    }

    body.is-red-mode .time-btn.active,
    body.is-red-mode .center-btn.active,
    body.is-red-mode .orbit-btn.active,
    body.is-red-mode .vision-btn[aria-pressed="true"] {
      background: rgba(200, 28, 36, 0.55);
      color: var(--text);
    }

    body.is-red-mode .event-sheet {
      background: rgba(12, 2, 2, 0.96);
      border-top-color: rgba(180, 30, 36, 0.28);
    }

    body.is-red-mode #sheet-close {
      background: rgba(200, 28, 36, 0.18);
    }

    body.is-red-mode #sheet-desc {
      color: #c88a8a;
    }

    body.is-red-mode .loading {
      color: var(--muted);
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 3;
    }

    .loading.visible { opacity: 1; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .event-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      background: rgba(10, 14, 24, 0.96);
      border-top: 1px solid var(--border);
      border-radius: 1rem 1rem 0 0;
      padding: 1rem 1.1rem max(1.25rem, env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      max-height: 55dvh;
      overflow-y: auto;
    }

    .event-sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 2.25rem;
      height: 0.2rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 0.85rem;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    #sheet-type {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    #sheet-close {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sheet-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.35rem;
      line-height: 1.3;
    }

    #sheet-time {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    #sheet-tsunami {
      display: none;
      font-size: 0.68rem;
      font-weight: 600;
      color: #5ac8fa;
      margin-top: 0.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #sheet-tsunami.visible {
      display: block;
    }

    #sheet-desc {
      font-size: 0.85rem;
      line-height: 1.5;
      margin-top: 0.75rem;
      color: #c8d0e0;
    }

    .sheet-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.85rem;
      gap: 0.5rem;
    }

    #sheet-source {
      font-size: 0.68rem;
      color: var(--muted);
    }

    #sheet-link {
      font-size: 0.72rem;
      color: var(--accent);
      text-decoration: none;
    }

    #sheet-link:hover { text-decoration: underline; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="fit-stage" class="fit-stage">
    <div id="app" class="app">
      <canvas id="globe-canvas" aria-label="3D Earth and Moon. Drag to orbit, pinch to zoom, tap pins for event details."></canvas>

      <div class="chrome">
        <div class="app-chrome">
          <h1 class="app-title">CalamityVille</h1>
        </div>

        <div class="bottom-card">
          <div class="controls-row">
            <div class="time-toggle" role="group" aria-label="Time range">
              <button type="button" class="time-btn active" data-hours="72">72h</button>
              <button type="button" class="time-btn" data-hours="48">48h</button>
              <button type="button" class="time-btn" data-hours="24">24h</button>
            </div>

            <div class="center-toggle" role="group" aria-label="Orbit center">
              <button type="button" class="center-btn active" data-center="earth">Earth</button>
              <button type="button" class="center-btn" data-center="moon">Moon</button>
            </div>

            <button
              type="button"
              class="orbit-btn"
              id="orbit-btn"
              title="Slow continuous orbit (tap again to stop)"
              aria-pressed="false"
            >
              Orbit
            </button>

            <button
              type="button"
              class="vision-btn"
              id="vision-btn"
              title="Night vision: red display for dark-adapted eyes"
              aria-pressed="false"
            >
              Red
            </button>
          </div>

          <div class="legend" role="group" aria-label="Filter event types">
            <button type="button" class="legend-item active" data-type="earthquake" aria-pressed="true">
              <span class="legend-dot" style="background:#ff9f0a"></span>Earthquake
            </button>
            <button type="button" class="legend-item active" data-type="volcano" aria-pressed="true">
              <span class="legend-dot" style="background:#bf5af2"></span>Volcano
            </button>
            <button type="button" class="legend-item active" data-type="hurricane" aria-pressed="true">
              <span class="legend-dot" style="background:#9ca3af"></span>Hurricane
            </button>
            <button type="button" class="legend-item active" data-type="fire" aria-pressed="true">
              <span class="legend-dot" style="background:#ff2d55"></span>Wildfire
            </button>
            <button type="button" class="legend-item active" data-type="flood" aria-pressed="true">
              <span class="legend-dot" style="background:#30d158"></span>Flood
            </button>
            <button type="button" class="legend-item active" data-type="tornado" aria-pressed="true">
              <span class="legend-tornado-key" aria-hidden="true">
                <span class="legend-dot legend-dot--tornado"></span>
                <span class="legend-dot legend-dot--tornado-confirmed"></span>
              </span>Tornado
            </button>
            <button type="button" class="legend-item active" data-type="tsunami" aria-pressed="true">
              <span class="legend-dot" style="background:#5ac8fa"></span>Tsunami
            </button>
            <p id="event-count">0 events</p>
          </div>
        </div>
      </div>

      <p id="loading" class="loading" aria-live="polite">Loading events…</p>
    </div>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" aria-hidden="true"></div>
  <aside id="event-sheet" class="event-sheet" role="dialog" aria-labelledby="sheet-title" aria-modal="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-header">
      <div>
        <p id="sheet-type">Event</p>
        <h2 id="sheet-title">—</h2>
        <p id="sheet-time"></p>
        <p id="sheet-tsunami">Tsunami advisory</p>
      </div>
      <button type="button" id="sheet-close" aria-label="Close">×</button>
    </div>
    <p id="sheet-desc"></p>
    <div class="sheet-footer">
      <span id="sheet-source"></span>
      <a id="sheet-link" href="#" target="_blank" rel="noopener noreferrer">Details →</a>
    </div>
  </aside>

  <script src="fit-to-screen.js"></script>
  <script src="astronomy.js"></script>
  <script type="module">
    import { bootGlobe } from "./app.js";

    let globe = null;
    let redModeOn = false;

    const visionBtn = document.getElementById("vision-btn");

    function setRedMode(on) {
      redModeOn = !!on;
      document.body.classList.toggle("is-red-mode", redModeOn);
      if (visionBtn) {
        visionBtn.textContent = redModeOn ? "White" : "Red";
        visionBtn.setAttribute("aria-pressed", redModeOn ? "true" : "false");
        visionBtn.title = redModeOn
          ? "Return to normal (white) display"
          : "Night vision: red display for dark-adapted eyes";
      }
    }

    visionBtn?.addEventListener("click", (e) => {
      e.preventDefault();
      setRedMode(!redModeOn);
    });

    const fit = FitToScreen.create({
      stage: "fit-stage",
      app: "app",
      useScaleForLayout: () => false,
      onFit: () => {
        if (!globe) globe = bootGlobe();
        else globe.resize();
      },
    });

    fit.bindViewportListeners();
    fit.bootLayout();
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
